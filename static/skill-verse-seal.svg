<?xml version="1.0" encoding="UTF-8"?>
<!-- Skill Verse - Official Digitally Verified Certificate Seal (vector SVG)
     - 4096x4096 viewBox for Ultra HD export
     - Transparent background
     - Colors: premium blue #0F4C81, navy #0A2540, gold #D4AF37, white
     - Metallic effects, guilloché, micro-text, laurel, book+cap+circuits icon
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="4096" height="4096" viewBox="0 0 4096 4096" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Colors -->
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF5D6" />
      <stop offset="30%" stop-color="#F2D27A" />
      <stop offset="60%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#B5851F" />
    </linearGradient>

    <radialGradient id="metalShine" cx="30%" cy="20%" r="80%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="30%" stop-color="#FFFFFF" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.0"/>
    </radialGradient>

    <linearGradient id="holo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6EE7F2" stop-opacity="0.18"/>
      <stop offset="25%" stop-color="#9B8CFF" stop-opacity="0.12"/>
      <stop offset="50%" stop-color="#FFD27F" stop-opacity="0.14"/>
      <stop offset="75%" stop-color="#8BE17A" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#6EE7F2" stop-opacity="0.08"/>
    </linearGradient>

    <!-- Guilloché pattern: concentric wavy lines created by path repetition -->
    <pattern id="guilloche" patternUnits="userSpaceOnUse" width="4096" height="4096">
      <g transform="translate(2048,2048)">
        <!-- Draw many rotated faint circular waves -->
        <g id="waves" stroke="#0A2540" stroke-opacity="0.06" fill="none">
        </g>
      </g>
    </pattern>

    <!-- Micro-text path for border -->
    <path id="outerCirclePath" d="M2048,184  a1864,1864 0 1,1 0,3728 a1864,1864 0 1,1 0,-3728" />

    <!-- Fonts: Use system fallback; for production, replace with licensed font embedding -->
    <style type="text/css"><![CDATA[
      .brand{font-family: 'Georgia', 'Times New Roman', serif; font-weight:700; fill:#0A2540}
      .serif{font-family:'Georgia','Times New Roman',serif; fill:#0A2540}
      .sans{font-family: 'Arial', 'Helvetica', sans-serif; fill:#0A2540}
      .micro{font-family: 'Arial', 'Helvetica', sans-serif; font-size:22px; fill:#0A2540; letter-spacing:2px}
    ]]></style>

    <!-- Soft inner shadow filter for emboss effect -->
    <filter id="emboss" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="blur"/>
      <feOffset in="blur" dx="4" dy="4" result="off1"/>
      <feSpecularLighting in="blur" surfaceScale="5" specularConstant="0.6" specularExponent="20" result="spec">
        <fePointLight x="-1000" y="-2000" z="4000"/>
      </feSpecularLighting>
      <feComposite in="spec" in2="off1" operator="in" result="specMask"/>
      <feMerge>
        <feMergeNode in="specMask"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Fine security lines (very faint) -->
    <pattern id="securityLines" patternUnits="userSpaceOnUse" width="24" height="24">
      <path d="M0,0 L24,0" stroke="#0A2540" stroke-opacity="0.02" stroke-width="1" />
    </pattern>

  </defs>

  <!-- Guilloché generation using many concentric circles with sinusoidal perturbation -->
  <g id="guillocheGroup" transform="translate(2048,2048)">
    <!-- Generate 160 rings programmatically-like (hand-encoded for static SVG) -->
    <!-- The following set is a simplified guilloché approximation using dashed paths -->
    <g stroke="#0A2540" stroke-opacity="0.06" fill="none">
      <circle r="1700" stroke-width="2" stroke-dasharray="6 12" />
      <circle r="1620" stroke-width="1.4" stroke-dasharray="4 10" />
      <circle r="1540" stroke-width="1.2" stroke-dasharray="3 8" />
      <circle r="1460" stroke-width="1" stroke-dasharray="2 6" />
      <circle r="1380" stroke-width="0.9" stroke-dasharray="1 5" />
    </g>
  </g>

  <!-- Outer scalloped gold edge -->
  <g transform="translate(2048,2048)">
    <path d="" id="scalloped"/>
    <!-- create scalloped by many arcs -->
    <g id="scallopGroup">
      <!-- outer gold scallop ring -->
      <path d="M0 -1960
        " fill="url(#goldGrad)" stroke="#B5851F" stroke-width="6" filter="url(#emboss)"/>
    </g>
  </g>

  <!-- Large gold outer ring (embossed) -->
  <g transform="translate(2048,2048)">
    <circle r="1900" fill="url(#goldGrad)" stroke="#C79B2E" stroke-width="10" filter="url(#emboss)"/>
    <circle r="1820" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="18" />
  </g>

  <!-- Navy ring for text -->
  <g transform="translate(2048,2048)">
    <circle r="1600" fill="#0A2540" stroke="#0F4C81" stroke-width="18" />
    <!-- decorative small stars and laurel segments on ring -->
    <g transform="rotate(-90)">
      <g id="ringDecor" fill="#D4AF37" opacity="0.98">
        <!-- left laurel (as a repeated element) -->
        <g transform="translate(-1100,0) scale(1.4)">
          <path d="M-60,-220 C-40,-180 -30,-140 -10,-110 C-30,-90 -50,-70 -60,-40 C-85,-30 -90,-10 -90,0 C-90,10 -85,30 -60,40 C-50,70 -30,90 -10,110 C-30,140 -40,180 -60,220 Z"/>
        </g>
        <!-- right laurel mirrored -->
        <g transform="translate(1100,0) scale(-1.4,1.4)">
          <path d="M-60,-220 C-40,-180 -30,-140 -10,-110 C-30,-90 -50,-70 -60,-40 C-85,-30 -90,-10 -90,0 C-90,10 -85,30 -60,40 C-50,70 -30,90 -10,110 C-30,140 -40,180 -60,220 Z"/>
        </g>
        <!-- small star top and bottom markers -->
        <g transform="rotate(0)">
          <polygon points="0,-150 14,-110 60,-110 22,-82 36,-40 0,-60 -36,-40 -22,-82 -60,-110 -14,-110"/>
        </g>
      </g>
    </g>
  </g>

  <!-- Inner white disk with dotted inner ring -->
  <circle cx="2048" cy="2048" r="1400" fill="#FFFFFF" />
  <circle cx="2048" cy="2048" r="1340" fill="none" stroke="#0A2540" stroke-dasharray="8 12" stroke-width="12" stroke-opacity="0.9" />

  <!-- Center icon: open book with graduation cap + circuit lines + shining star -->
  <g id="centerIcon" transform="translate(2048,1700)">
    <!-- Book base -->
    <g transform="translate(0,180)">
      <path d="M-420,200 C-220,120 -120,60 0,60 C120,60 220,120 420,200 L420,240 C220,120 120,60 0,60 C-120,60 -220,120 -420,240 Z" fill="#0F4C81" opacity="0.0"/>
      <!-- stylized open book pages -->
      <path d="M-520,40 L-150,-180 L0,-120 L-10,-110 L-150,-40 L-520,40 Z" fill="#0A2540"/>
      <path d="M520,40 L150,-180 L0,-120 L10,-110 L150,-40 L520,40 Z" fill="#0F4C81"/>
      <!-- inner page highlights -->
      <path d="M-360,-20 L-120,-100" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="10" />
      <path d="M360,-20 L120,-100" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="10" />
    </g>

    <!-- graduation cap above center of book -->
    <g transform="translate(0,-200)">
      <path d="M0,-16 L380,80 L0,176 L-380,80 Z" fill="#0A2540"/>
      <rect x="-48" y="110" width="96" height="36" rx="6" fill="#0A2540"/>
      <!-- tassel -->
      <path d="M200,72 C260,90 260,140 240,180" stroke="#D4AF37" stroke-width="12" fill="none" stroke-linecap="round"/>
      <circle cx="228" cy="184" r="16" fill="#D4AF37"/>
    </g>

    <!-- circuit lines integrated into the book's right page -->
    <g transform="translate(180,40) scale(1.2)">
      <path d="M0,0 C40,-20 80,-40 120,-50" stroke="#0F4C81" stroke-width="12" fill="none" stroke-linecap="round"/>
      <circle cx="120" cy="-50" r="10" fill="#0F4C81"/>
      <path d="M40,20 C80,10 120,0 160,-10" stroke="#0F4C81" stroke-width="8" fill="none" stroke-linecap="round"/>
      <circle cx="160" cy="-10" r="6" fill="#0F4C81"/>
    </g>

    <!-- circuit lines integrated into the book's left page (mirrored) -->
    <g transform="translate(-180,40) scale(-1.2,1.2)">
      <path d="M0,0 C40,-20 80,-40 120,-50" stroke="#0F4C81" stroke-width="12" fill="none" stroke-linecap="round"/>
      <circle cx="120" cy="-50" r="10" fill="#0F4C81"/>
      <path d="M40,20 C80,10 120,0 160,-10" stroke="#0F4C81" stroke-width="8" fill="none" stroke-linecap="round"/>
      <circle cx="160" cy="-10" r="6" fill="#0F4C81"/>
    </g>

    <!-- small shining star above the icon -->
    <g transform="translate(0,-380)">
      <polygon points="0,-40 11,-14 40,-10 16,6 22,36 0,18 -22,36 -16,6 -40,-10 -11,-14" fill="#FFD97D" stroke="#E6B84A" stroke-width="2"/>
    </g>
  </g>

  <!-- Main brand text beneath center icon -->
  <g transform="translate(2048,2460)">
    <text x="0" y="0" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="220" fill="#0A2540" font-weight="700">SKILL VERSE</text>
    <!-- decorative divider -->
    <rect x="-260" y="36" width="520" height="8" rx="4" fill="#D4AF37"/>
  </g>

  <!-- Inner Text: two-line -->
  <g transform="translate(2048,2760)" text-anchor="middle">
    <text x="0" y="0" font-family="Arial, Helvetica, sans-serif" font-size="64" fill="#0A2540" font-weight="700">EMPOWERING LEARNERS</text>
    <text x="0" y="80" font-family="Arial, Helvetica, sans-serif" font-size="64" fill="#0A2540" font-weight="700">BUILDING FUTURES</text>
  </g>

  <!-- Outer ring text (Top + Bottom) -->
  <g>
    <!-- Top: SKILL VERSE along top arc -->
    <text font-family="Georgia, 'Times New Roman', serif" font-size="120" fill="#FFFFFF" font-weight="700">
      <textPath xlink:href="#outerCirclePath" startOffset="14%" text-anchor="middle" letter-spacing="6">SKILL VERSE</textPath>
    </text>

    <!-- Bottom: DIGITALLY VERIFIED • CERTIFIED LEARNING along inner bottom arc (use reversed path) -->
    <path id="outerCirclePathBottom" d="M2048,3900 a1520,1520 0 1,0 0,-3040 a1520,1520 0 1,0 0,3040" fill="none"/>
    <text font-family="Arial, Helvetica, sans-serif" font-size="64" fill="#FFFFFF" font-weight="700">
      <textPath xlink:href="#outerCirclePathBottom" startOffset="48%" text-anchor="middle" letter-spacing="3">DIGITALLY VERIFIED • CERTIFIED LEARNING</textPath>
    </text>
  </g>

  <!-- Micro-text border repeating around inner edge -->
  <g>
    <text font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#0A2540" opacity="0.9">
      <textPath xlink:href="#outerCirclePath" startOffset="0%" spacing="auto">SKILL VERSE • VERIFIED • AUTHENTIC • CERTIFIED • SKILL VERSE • VERIFIED • AUTHENTIC • CERTIFIED •</textPath>
    </text>
  </g>

  <!-- Bottom ribbon -->
  <g transform="translate(2048,3300)">
    <path d="M-620,0 L620,0 L560,120 Q0,200 -560,120 Z" fill="#0A2540" stroke="#0F4C81" stroke-width="6" />
    <text x="0" y="80" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="72" fill="#D4AF37" font-weight="700">EST. 2026</text>
  </g>

  <!-- Security overlay: holographic shimmer -->
  <g opacity="0.55">
    <rect x="0" y="0" width="4096" height="4096" fill="url(#holo)" style="mix-blend-mode:screen;"/>
  </g>

  <!-- Subtle watermark texture in center (very low opacity) -->
  <g transform="translate(2048,2048)" opacity="0.06">
    <text x="0" y="40" text-anchor="middle" font-size="240" font-family="Arial, Helvetica, sans-serif" fill="#0A2540">SKILL VERSE</text>
  </g>

  <!-- Fine security lines pattern overlay inside inner disk -->
  <g>
    <circle cx="2048" cy="2048" r="1280" fill="url(#securityLines)" />
  </g>

  <!-- Official verification badge (small) -->
  <g transform="translate(3200,1100)">
    <circle r="120" fill="#0F4C81" stroke="#D4AF37" stroke-width="10"/>
    <polygon points="-30,-10 0,-90 30,-10 90,-10 40,30 60,90 0,50 -60,90 -40,30 -90,-10" fill="#D4AF37"/>
  </g>

  <!-- Edge highlights and inner shadow to enhance metallic emboss -->
  <g>
    <circle cx="2048" cy="2048" r="1900" fill="none" stroke="url(#metalShine)" stroke-width="24" stroke-opacity="0.45"/>
    <circle cx="2048" cy="2048" r="1600" fill="none" stroke="url(#metalShine)" stroke-width="16" stroke-opacity="0.25"/>
  </g>

  <!-- Print/usage note (non-printing: comment) -->
  <!-- To export a PNG: open this SVG in Inkscape/Illustrator, set export area to page, export at 4096x4096 with background set to transparent. For best metallic appearance, export PNG and refine in raster editor for subtle lens glints. -->

</svg>